[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "demo-price-watch"
version = "0.1.0"
description = "Offline catalogue extraction and price change reports"
requires-python = ">=3.12"
dependencies = ["beautifulsoup4>=4.12,<5"]

[project.optional-dependencies]
dev = ["ruff", "Pillow"]

[project.scripts]
pricewatch = "pricewatch.cli:main"

[tool.setuptools.packages.find]
include = ["pricewatch*"]

[tool.setuptools.package-data]
pricewatch = ["selectors.json"]

[tool.ruff]
line-length = 100
exclude = [".venv"]
target-version = "py312"
